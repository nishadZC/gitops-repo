apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: app1-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/nishadZC/gitops-repo.git
    targetRevision: main
    path: charts/app1

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true