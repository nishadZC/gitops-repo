trigger: none

pool:
  vmImage: ubuntu-latest

parameters:
- name: imageTag
  type: string
  default: ""

variables:
- name: ContainerRegistry
  value: akscontaineregistrydemo.azurecr.io

- name: imageRepository
  value: app1nginxaks


steps:

- checkout: self
  persistCredentials: true
  fetchDepth: 0

- bash: |

    set -e

    sudo wget https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
      -O /usr/local/bin/yq

    sudo chmod +x /usr/local/bin/yq

    git fetch origin main
    git checkout -B main origin/main

    cd app1

    yq -i '
    .spec.template.spec.containers[0].image =
    "$(ContainerRegistry)/$(imageRepository):${{ parameters.imageTag }}"
    ' deployment.yml

    git config user.email "azurepipeline@gmail.com"
    git config user.name "Azure Pipeline"

    git add deployment.yml

    if git diff --cached --quiet; then
        echo "No changes"
    else
        git commit -m "Deploy ${{ parameters.imageTag }}"
        git push origin main
    fi

  displayName: Update GitOps Manifest