apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: app1nginxaks
  namespace: {{ .Values.namespace }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
  - http:
      paths:
      - path: {{ .Values.ingress.path }}
        pathType: Prefix

        backend:
          service:
            name: app1nginxaks
            port:
              number: {{ .Values.service.port }}