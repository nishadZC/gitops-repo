apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1nginxaks
  namespace: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1nginxaks
  template:
    metadata:
      labels:
        app: app1nginxaks
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: app1nginxaks
          image: akscontaineregistrydemo.azurecr.io/app1nginxaks:04672b113a89c60f33a4f8b68da1c9d275b8ae6a
          imagePullPolicy: Always
          ports:
            - containerPort: 80
